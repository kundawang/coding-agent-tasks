<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tickwars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <canvas id="game" width="960" height="640"></canvas>

  <section id="hud" class="hidden">
    <div id="hud-left" class="hud-team">
      <span id="p1-score" class="score">0</span>
      <span id="p1-hp" class="hp"></span>
    </div>
    <div id="hud-center">
      <div id="hud-timer">3:00</div>
      <div id="hud-points"></div>
    </div>
    <div id="hud-right" class="hud-team">
      <span id="p2-hp" class="hp"></span>
      <span id="p2-score" class="score">0</span>
    </div>
  </section>

  <section id="menu" class="overlay">
    <h1>tickwars</h1>
    <p class="tagline">本地双人抢点 · 固定 tick 逻辑 · 可逐帧回放</p>
    <div class="btn-col">
      <button id="btn-play">开始对战</button>
      <button id="btn-load">导入回放观战</button>
    </div>
    <input id="replay-file" type="file" accept="application/json,.json" hidden>
    <p class="help">玩家一 <b>WASD</b> 移动 · <b>空格</b> 攻击 · <b>Q</b> 暂停<br>
       玩家二 <b>方向键</b> 移动 · <b>回车</b> 攻击 · <b>P</b> 暂停<br>
       三分钟占点得分高者胜；复活有出生无敌。</p>
  </section>

  <section id="result" class="overlay hidden">
    <h2 id="result-title"></h2>
    <p id="result-detail"></p>
    <div class="btn-row">
      <button id="btn-watch">观看回放</button>
      <button id="btn-export">导出回放 (.json)</button>
      <button id="btn-rematch">再来一局</button>
      <button id="btn-menu">回主菜单</button>
    </div>
  </section>

  <section id="replay-bar" class="hidden">
    <input id="seek" type="range" min="0" max="0" value="0" step="1">
    <div class="replay-row">
      <button id="rp-play">▶</button>
      <span id="rp-tick">0 / 0</span>
      <span id="rp-verify" title="快照校验"></span>
      <span class="spacer"></span>
      <label><input type="radio" name="rp-speed" value="0.25">0.25×</label>
      <label><input type="radio" name="rp-speed" value="0.5">0.5×</label>
      <label><input type="radio" name="rp-speed" value="1" checked>1×</label>
      <label><input type="radio" name="rp-speed" value="2">2×</label>
      <button id="rp-step-back">−1帧</button>
      <button id="rp-step-fwd">+1帧</button>
      <button id="rp-export">导出</button>
      <button id="rp-close">退出观战</button>
    </div>
    <div id="rp-events"></div>
  </section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>

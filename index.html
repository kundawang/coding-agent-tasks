<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>街角小店</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 id="shop-name">街角小店</h1>
      <div class="stats">
        <span class="stat" id="stat-day">第 1 天</span>
        <span class="stat cash" id="stat-cash">0.00 元</span>
        <span class="stat">货架 <span id="stat-slots">0 / 24</span></span>
        <button id="reset-btn" class="btn-ghost" type="button">清档重开</button>
      </div>
    </header>

    <div id="fatal" class="notice notice-blocked" hidden></div>
    <div id="notices"></div>

    <section class="daycard">
      <div class="daybar">
        <div id="day-progress-bar"></div>
      </div>
      <div id="day-progress-text" class="muted"></div>
    </section>

    <main class="grid">
      <section class="panel">
        <h2>进货 / 定价</h2>
        <table>
          <thead>
            <tr>
              <th>商品</th>
              <th>进价</th>
              <th>售价（元）</th>
              <th>进货</th>
            </tr>
          </thead>
          <tbody id="goods-body"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>货架</h2>
        <table>
          <thead>
            <tr>
              <th>商品</th>
              <th>库存</th>
              <th>占用</th>
              <th>保质期</th>
              <th>当前售价</th>
            </tr>
          </thead>
          <tbody id="stock-body"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>每日报表（近 14 天）</h2>
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>营业收入</th>
              <th>净利润</th>
              <th>卖出</th>
              <th>过期报损</th>
            </tr>
          </thead>
          <tbody id="reports-body"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>事件记录</h2>
        <ul id="event-list" class="event-list"></ul>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
